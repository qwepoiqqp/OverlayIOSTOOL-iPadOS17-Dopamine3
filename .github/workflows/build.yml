name: Build iOS Tweak

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (macOS / Xcode arm64e)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies (ldid, dpkg, xz)
        run: brew install ldid dpkg xz make

      - name: Install Theos
        run: |
          git clone --quiet --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Fix maintainer script permissions
        run: |
          for s in preinst postinst prerm postrm; do
            [ -f "$s" ] && chmod 0755 "$s" || true
            [ -f "layout/DEBIAN/$s" ] && chmod 0755 "layout/DEBIAN/$s" || true
          done
          ls -la postinst || true

      - name: Build Package (real Xcode toolchain -> correct arm64e)
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1

      - name: Re-sign companion app with sandbox-escape entitlements
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -1)"
          echo "deb = $DEB"
          TMP="$(mktemp -d)"
          dpkg-deb -R "$DEB" "$TMP"
          APPBIN="$(find "$TMP" -name OverlayIOSTOOLApp -type f | head -1 || true)"
          if [ -n "$APPBIN" ] && [ -f entitlements.plist ]; then
            ldid -Sentitlements.plist "$APPBIN"
            echo "re-signed app with entitlements"
          fi
          dpkg-deb -b "$TMP" "$DEB"

      - name: Audit iPadOS 17 rootless package
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -1)"
          python3 tools/verify_ios17_rootless.py "$DEB"

      - name: Show package info
        run: |
          ls -la packages/
          for d in packages/*.deb; do
            echo "=== $d ==="
            dpkg-deb -c "$d" | grep -E 'DynamicLibraries|Applications/' || true
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayIOSTOOL-deb
          path: packages/*.deb
        if: success()
